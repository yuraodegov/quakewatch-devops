# Secret values, injected into the container as environment variables.
# NOTE: demo value for the course project only. Real secrets must never be committed to git:
# create them with "kubectl create secret generic ..." or use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: quakewatch-secret
  namespace: quakewatch
  labels:
    app: quakewatch
type: Opaque
# stringData takes plain text; Kubernetes stores it base64-encoded in .data
stringData:
  SECRET_KEY: "change-me-demo-only"
