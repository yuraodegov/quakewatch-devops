# Exposes the QuakeWatch Pods. NodePort makes it reachable from outside the cluster.
# On Docker Desktop in kind mode the node port is not mapped to localhost,
# so locally use: kubectl -n quakewatch port-forward svc/quakewatch 5000:5000
apiVersion: v1
kind: Service
metadata:
  name: quakewatch
  namespace: quakewatch
  labels:
    app: quakewatch
spec:
  type: NodePort
  selector:
    app: quakewatch
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
