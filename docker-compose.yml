# Run QuakeWatch locally:  docker compose up -d --build
# Then open:               http://localhost:5000

services:
  quakewatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: yuraodegov/quakewatch:1.0.0
    container_name: quakewatch
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      # Persist app log files (error.log / access.log) outside the container
      - quakewatch-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  quakewatch-logs:
